format_version = 1
package_id = "star.control.core"
package_version = "1.5.2"
display_name = "Star-Control Core"
description = "Required release-owned typed Controller commands exposed through the live Tool Registry."
required = true
publisher = "Star-Control"
license = "MIT"
backend_kinds = ["controller_command"]

[[actions]]
tool_id = "star.core.goal.start"
backend_kind = "controller_command"
backend_ref = "goal.start"
display_name = "Start Goal"
summary = "Create and start a durable goal."
description = "Starts a durable Star-Control goal through the typed Controller command."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "non_idempotent"
input_schema_file = "schemas/goal-start-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.goal.answer"
backend_kind = "controller_command"
backend_ref = "goal.answer"
display_name = "Answer Goal Question"
summary = "Answer a typed question for a goal."
description = "Records a typed answer for a goal that is waiting for user input."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "non_idempotent"
input_schema_file = "schemas/goal-answer-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.plan.get"
backend_kind = "controller_command"
backend_ref = "plan.get"
display_name = "Get Plan"
summary = "Read the current plan."
description = "Reads the current durable plan without making a change."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/goal-get-input.schema.json"
output_schema_file = "schemas/plan-get-output.schema.json"

[[actions]]
tool_id = "star.core.plan.update"
backend_kind = "controller_command"
backend_ref = "plan.update"
display_name = "Update Plan"
summary = "Update the current plan."
description = "Applies a typed update to the durable plan."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "non_idempotent"
input_schema_file = "schemas/plan-update-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.run.continue"
backend_kind = "controller_command"
backend_ref = "run.continue"
display_name = "Continue Run"
summary = "Continue an approved run."
description = "Continues a run after the Controller confirms its current policy scope."
permission_actions = ["local_delete", "external_write"]
paid_action = "no"
idempotency = "non_idempotent"
input_schema_file = "schemas/goal-mutation-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.status.get"
backend_kind = "controller_command"
backend_ref = "goal.status"
display_name = "Get Goal Status"
summary = "Read goal status."
description = "Reads the typed status of one durable goal."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/goal-get-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.goal.pause"
backend_kind = "controller_command"
backend_ref = "goal.pause"
display_name = "Pause Goal"
summary = "Pause a goal."
description = "Requests a durable goal pause through the Controller."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "idempotent"
input_schema_file = "schemas/goal-mutation-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.goal.resume"
backend_kind = "controller_command"
backend_ref = "goal.resume"
display_name = "Resume Goal"
summary = "Resume a goal."
description = "Requests a durable goal resume through the Controller."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "idempotent"
input_schema_file = "schemas/goal-mutation-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.goal.cancel"
backend_kind = "controller_command"
backend_ref = "goal.cancel"
display_name = "Cancel Goal"
summary = "Cancel a goal."
description = "Requests cancellation of a durable goal and its authorized child work."
permission_actions = ["local_delete", "external_write"]
paid_action = "no"
idempotency = "idempotent"
input_schema_file = "schemas/goal-mutation-input.schema.json"
output_schema_file = "schemas/goal-record-output.schema.json"

[[actions]]
tool_id = "star.core.evidence.get"
backend_kind = "controller_command"
backend_ref = "evidence.get"
display_name = "Get Evidence"
summary = "Read recorded evidence."
description = "Reads evidence references and typed verification records."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/evidence-get-input.schema.json"
output_schema_file = "schemas/evidence-get-output.schema.json"

[[actions]]
tool_id = "star.core.merge.status"
backend_kind = "controller_command"
backend_ref = "merge.status"
display_name = "Get Merge Status"
summary = "Read merge status."
description = "Reads the current merge readiness and conflict status."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/goal-get-input.schema.json"
output_schema_file = "schemas/change-bundle-output.schema.json"

[[actions]]
tool_id = "star.core.handoff.get"
backend_kind = "controller_command"
backend_ref = "handoff.get"
display_name = "Get Handoff"
summary = "Read handoff information."
description = "Reads the current typed handoff record for a goal."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/goal-get-input.schema.json"
output_schema_file = "schemas/change-bundle-handoff-output.schema.json"

[[actions]]
tool_id = "star.core.doctor"
backend_kind = "controller_command"
backend_ref = "doctor.run"
display_name = "Run Doctor"
summary = "Run Star-Control doctor diagnostics."
description = "Runs the typed read-only Star-Control doctor diagnostics."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/doctor-input.schema.json"
output_schema_file = "schemas/doctor-output.schema.json"

[[actions]]
tool_id = "star.core.project.list"
backend_kind = "controller_command"
backend_ref = "project.list"
display_name = "List Projects"
summary = "Inspect the tracked project catalog."
description = "Reads the Git-tracked project allowlist and probes only its declared roots without registration or recursive discovery."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/project-list-input.schema.json"
output_schema_file = "schemas/project-list-output.schema.json"

[[actions]]
tool_id = "star.core.project.status"
backend_kind = "controller_command"
backend_ref = "project.status"
display_name = "Get Project Status"
summary = "Inspect one allowlisted project."
description = "Reads one tracked catalog entry and reports its exact-root availability, checkout kind, origin, and git-common-dir identity state."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/project-status-input.schema.json"
output_schema_file = "schemas/project-status-output.schema.json"

[[actions]]
tool_id = "star.core.project.register"
backend_kind = "controller_command"
backend_ref = "project.register"
display_name = "Register Project"
summary = "Register the current project for managed code-health scans."
description = "Registers the identity-matched current project in derived management state with an explicit idempotency key before a managed scan is requested."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "non_idempotent"
input_schema_file = "schemas/project-register-input.schema.json"
output_schema_file = "schemas/project-register-output.schema.json"

[[actions]]
tool_id = "star.core.scan.run"
backend_kind = "controller_command"
backend_ref = "scan.run"
display_name = "Run Project Scan"
summary = "Build a source-bound code-health index and findings."
description = "Runs the existing full or incremental managed scan for an exact ProjectId and returns its ScanRun, CodeIndexSnapshot, and Finding count without applying source changes."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "non_idempotent"
input_schema_file = "schemas/scan-run-input.schema.json"
output_schema_file = "schemas/scan-run-output.schema.json"

[[actions]]
tool_id = "star.core.index.status"
backend_kind = "controller_command"
backend_ref = "index.status"
display_name = "Get Code Index Status"
summary = "Read the current code-health index status and coverage."
description = "Returns the latest CodeIndexSnapshot and an explicit current flag for an exact ProjectId."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/project-id-input.schema.json"
output_schema_file = "schemas/index-status-output.schema.json"

[[actions]]
tool_id = "star.core.index.search"
backend_kind = "controller_command"
backend_ref = "index.search"
display_name = "Search Code Index"
summary = "Search the source-bound code-health index."
description = "Searches text, syntax, or semantic index entities with an explicit current-snapshot requirement and preserves coverage limitations."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/index-search-input.schema.json"
output_schema_file = "schemas/index-search-output.schema.json"

[[actions]]
tool_id = "star.core.finding.list"
backend_kind = "controller_command"
backend_ref = "finding.list"
display_name = "List Code Health Findings"
summary = "List normalized code-health findings for a project."
description = "Returns the existing source-bound Finding records for an exact ProjectId without preparing or applying remediation."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/project-id-input.schema.json"
output_schema_file = "schemas/finding-list-output.schema.json"

[[actions]]
tool_id = "star.core.diagnostic.list"
backend_kind = "controller_command"
backend_ref = "diagnostic.list"
display_name = "List Validation Diagnostics"
summary = "List normalized validation diagnostics for code-health review."
description = "Returns DiagnosticV2 records for an exact ProjectId without changing baseline, suppression, Gate, or source state."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/project-id-input.schema.json"
output_schema_file = "schemas/diagnostic-list-output.schema.json"

[[actions]]
tool_id = "star.core.validation.plan"
backend_kind = "controller_command"
backend_ref = "validation.plan"
display_name = "Plan Validation"
summary = "Plan impact-based validation."
description = "Observes one identity-matched tracked project root and returns a sealed tracked-path ValidationPlan without running commands or mutating cache state."
permission_actions = ["local_read"]
paid_action = "no"
idempotency = "read_only"
input_schema_file = "schemas/validation-plan-input.schema.json"
output_schema_file = "schemas/validation-plan-output.schema.json"

[[actions]]
tool_id = "star.core.validation.run"
backend_kind = "controller_command"
backend_ref = "validation.run"
display_name = "Run Validation"
summary = "Run the tracked native validation entrypoint."
description = "Builds a current tracked-path plan, invokes the identity-matched project's scripts/validate.ps1 in a bounded Job Object, reuses only identical complete stable pass evidence with intact artifacts, and returns the native report without promoting partial, unverified, or flaky evidence to pass."
permission_actions = ["local_write"]
paid_action = "no"
idempotency = "non_idempotent"
execution_mode = "detachable"
expected_duration_ms = 600000
input_schema_file = "schemas/validation-run-input.schema.json"
output_schema_file = "schemas/validation-run-output.schema.json"
